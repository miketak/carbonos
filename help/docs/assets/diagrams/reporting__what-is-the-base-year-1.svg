<!-- source-sha256:6902da29a26afa12 --><svg id="d6902da29a26afa12" width="100%" xmlns="http://www.w3.org/2000/svg" class="statediagram" style="max-width: 615.984375px;" viewBox="4 4 615.984375 462" role="graphics-document document" aria-roledescription="stateDiagram" aria-describedby="chart-desc-d6902da29a26afa12" aria-labelledby="chart-title-d6902da29a26afa12"><title id="chart-title-d6902da29a26afa12">The states of a base-year recalculation candidate</title><desc id="chart-desc-d6902da29a26afa12">A candidate is flagged by a freeze whose boundary differs from the base year's, by accepting a factor pack edition, or by hand for a methodology change or a corrected error. A flagged candidate is decided by recording a run of the base-year inventory as the recalculated base, or by declining it with a note. A flagged candidate raised by a boundary change is superseded when a later freeze puts the boundary back as the base year held it.</desc><style>#d6902da29a26afa12{font-family:Inter,system-ui,sans-serif;font-size:16px;fill:#000000;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#d6902da29a26afa12 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#d6902da29a26afa12 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#d6902da29a26afa12 .error-icon{fill:#552222;}#d6902da29a26afa12 .error-text{fill:#552222;stroke:#552222;}#d6902da29a26afa12 .edge-thickness-normal{stroke-width:1px;}#d6902da29a26afa12 .edge-thickness-thick{stroke-width:3.5px;}#d6902da29a26afa12 .edge-pattern-solid{stroke-dasharray:0;}#d6902da29a26afa12 .edge-thickness-invisible{stroke-width:0;fill:none;}#d6902da29a26afa12 .edge-pattern-dashed{stroke-dasharray:3;}#d6902da29a26afa12 .edge-pattern-dotted{stroke-dasharray:2;}#d6902da29a26afa12 .marker{fill:#666;stroke:#666;}#d6902da29a26afa12 .marker.cros