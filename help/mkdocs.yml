          - Add members and assign roles: tasks/organization/add-members-and-assign-roles.md
          - Record legal entities: tasks/organization/record-legal-entities.md
          - Record facilities and source streams: tasks/organization/record-facilities-and-source-streams.md
          - Define units and densities: tasks/organization/define-units-and-densities.md
          - Edit the organization's details and read its history: tasks/organization/edit-details-and-read-the-history.md
      - Activity data:
