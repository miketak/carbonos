# The navigation source for the CarbonOS help centre: the groups the hub
# shows, the articles under each, and the order they appear in. The help
# compiler (frontend/scripts/compile-help.mjs) reads this file; the React
# help renders the hub, the topic pages and the left tree from it.
#
# Keys:
#   slug            route segment; lowercase kebab-case, at most 60 characters
#   kind            task | what-is | step | fix | reference | glossary
#   from            the existing help/docs page(s) the article is made from,
#                   relative to help/docs, or "new"
#   title           the article title as the hub, the tree and the H1 show it
#   disposition     keep | split | merge | what-is | new (how the source page
#                   reaches the article; see docs/reviews/2026-09-28-help-ia.md)
#   showMoreAfter   how many article links the hub shows before "Show more"
#   series          groups whose articles are numbered steps with Previous/Next
#   legacy          old MkDocs URL path -> new route; filled at the takeover PR
#   dropped         existing pages with no article, and why
#
# Article titles are sentence case with no em-dashes: tasks start with a bare
# verb, concepts are "What is X?", troubleshooting is "Fix a ... problem",
# statuses are "Check a ... status".

