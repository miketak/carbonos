# Existing pages with no article. The hub and the topic pages are generated
# from the groups, so the section index pages have nothing left to say.
dropped:
  - path: index.md
    reason: The hub replaces the home page; its "start here" routes become the hub tagline and the Get started group.
  - path: concepts/index.md
    reason: Section index; the what-is articles sit inside the group they serve.
  - path: get-started/index.md
    reason: Section index; the Get started topic page is generated from the series.
  - path: tasks/index.md
    reason: Section index; topic pages are generated from the tree.
  - path: reference/index.md
    reason: Section index; reference articles sit inside the group they serve.
