<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="cos" data-theme="{{theme}}">
<div class="auth">
  <form class="auth-card" onSubmit="{{noop}}">
    <div class="auth-brand">
      <svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true" shape-rendering="geometricPrecision"><defs><linearGradient id="cm-login" gradientUnits="userSpaceOnUse" x1="60" y1="32" x2="4" y2="32"><stop offset="0" stop-color="#00b6aa"/><stop offset="0.15" stop-color="#05b8a7"/><stop offset="0.33" stop-color="#15bfa0"/><stop offset="0.54" stop-color="#2fca93"/><stop offset="0.77" stop-color="#53da82"/><stop offset="1" stop-color="#82ef6d"/></linearGradient></defs><path d="M 51.15 48.07 A 25 25 0 1 1 51.15 15.93" fill="none" stroke="url(#cm-login)" stroke-width="8" stroke-linecap="round"/><rect x="20" y="18" width="10" height="6" rx="3" fill="url(#cm-login)"/><rect x="20" y="29" width="17" height="6" rx="3" fill="url(#cm-login)"/><rect x="20" y="40" width="24" height="6" rx="3" fill="url(#cm-login)"/></svg>
      <span>Carbon<span class="os">OS</span></span>
    </div>
    <div class="auth-head">
      <h1 class="page-title sm">Sign in</h1>
    </div>
    <div class="banner banner-info"><div>Your password is reset. Sign in with your new password.</div></div>
    <div class="field"><label for="email">Email</label><input id="email" type="email" value="kofi@ecoriv.com" autocomplete="username"></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" value="••••••••••••" autocomplete="current-password"></div>
    <a class="btn btn-primary" href="Organizations.dc.html" style="width: 100%">Sign in</a>
    <div style="text-align: center; font-size: 14px"><a href="#forgot">Forgot your password?</a></div>
  </form>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {}
    const theme = s.theme || (this.props.dark ? 'dark' : 'light')
    return { theme, noop: (e) => { if (e && e.preventDefault) e.preventDefault() } }
  }
}
</script>
</body>
</html>
