procedure: 7
slug: the-pack-lifecycle-end-to-end
title: The pack lifecycle end to end
after: 6
covers: ["02.5", "02.6", "02.7", "02.3", "02.8", "01.3", "01.5"]
let:
  org: Adansi Foods Ltd
  edition: ghana-2027-gov
  r2: ghana-2027-gov.r2
  grid: "GHANA:grid:GHA:2024"
  gridFactor: "Grid electricity, Ghana (2024)"
  losses: "GHANA:td-losses"
  lpg: "Gaseous fuels: LPG (/litre)"
sections:
  - id: A
    title: The draft
    cases:
      - id: A1
        title: A clone starts from the predecessor's rows
        steps:
          - as: adminA
            do: { signIn: { user: adminA } }
          - do: { openFactorPacks: {} }
            expect:
              - editionListed: { edition: defra-2025, status: PUBLISHED, holders: 1 }
              - editionListed: { edition: defra-2026, status: PUBLISHED, holders: 1 }
              - editionListed: { edition: ghana, status: PUBLISHED, rows: 7, holders: 1 }
                why: "two families, defra with two PUBLISHED editions (2025 and 2026) and ghana with one, each edition with its applies-from date, its row count and how many organizations hold it: all three read \"1 organization\""
          - expect:
              - observe: { text: "Click Clone on the ghana edition: the dialog \"Clone ghana\" says the draft starts with the 7 rows of ghana, copied, with the name, source, URL, year and GWP basis filled in." }
          - do: { cloneEdition: { from: ghana, editionId: ghana } }
            expect:
              - refused: { rule: ghg.pack.edition-id-reused, with: { edition: ghana } }
          - do: { cloneEdition: { from: ghana, editionId: "${edition}", appliesFrom: "2026-01-01" } }
            expect:
              - editionListed: { edition: "${edition}", status: DRAFT, rows: 7, holders: 0 }
                why: "a toast reads \"ghana-2027-gov was created from ghana with its 7 rows.\"; the draft is listed under the family reading DRAFT, 7 rows, \"No organization\""
          - do: { editPackRow: { edition: ghana, code: "${grid}", kgCo2ePerUnit: 0.44 } }
            expect:
              - screenReads: { text: "This edition is published, so its rows, metadata and values never change again" }
              - refused: { rule: ghg.pack.edition-immutable, with: { edition: ghana, status: published } }
                why: reports already rest on them
      - id: A2
        title: One value changes, and the rules are read live
        steps:
          - do: { editPackRow: { edition: "${edition}", code: "${grid}", kgCo2ePerUnit: 0.44 } }
            expect:
              - packRowReads: { edition: ghana, code: "${grid}", kgCo2ePerUnit: 0.468809 }
                why: the published ghana still reads 0.468809
          - do: { editPackRow: { edition: "${edition}", code: "${grid}", newCode: grid2024, unit: widgets, dataYear: null } }
            expect:
              - editionValidation: { edition: "${edition}", findings: [{ rule: code, code: grid2024 }, { rule: unit, code: grid2024 }, { rule: provenance, code: grid2024 }] }
                why: "three findings on the row: the code needs two or more colon-separated segments, widgets is not a registered unit, and the provenance is missing the data year"
          - do: { editPackRow: { edition: "${edition}", code: grid2024, newCode: "${grid}", unit: kWh, dataYear: 2024 } }
            expect:
              - editionValidation: { edition: "${edition}", passes: true }
      - id: A3
        title: A caveated row publishes unapproved
        steps:
          - expect:
              - packRowReads: { edition: "${edition}", code: "${losses}", approved: false }
                why: "the derived losses row arrived from ghana with its caveat and unapproved; its Edit dialog shows the Caveat field filled: \"Derived, not published: approve it after checking the year's loss rate with the Energy Commission statistics, or replace it with the utility's figure.\""
          - do: { editPackRow: { edition: "${edition}", code: "${losses}", approved: true } }
            expect:
              - editionValidation: { edition: "${edition}", findings: [{ rule: caveat, code: "${losses}" }] }
                why: "one finding on the row: \"'Grid electricity T&D losses, Ghana (derived)' carries a caveat, so it publishes unapproved\", then the caveat itself; a caveat is the publisher's condition on using the value, and publication does not lift it (spec 02.5 rule 10)"
          - do: { editPackRow: { edition: "${edition}", code: "${losses}", approved: false } }
            expect:
              - editionValidation: { edition: "${edition}", passes: true }
  - id: B
    title: Publication
    cases:
      - id: B1
        title: The curator cannot publish
        steps:
          - do: { publishEdition: { edition: "${edition}" } }
            expect:
              - publishGate: { edition: "${edition}", noDocument: true }
              - dialogButtonDisabled: { dialog: "Publish ${edition}", button: Publish, rule: ghg.pack.approver-is-curator }
                why: "the dialog lists the conditions; the rules line passes; no source document yet, and the curator is the one asking"
          - do: { attachSourceDocument: { edition: "${edition}", file: source-document.txt } }
            expect:
              - publishGate: { edition: "${edition}", documentOnFile: true, curatorIsMe: true }
              - editionListed: { edition: "${edition}", status: DRAFT }
                why: "the citation is typed by whoever publishes, in case B2; the edition is still a draft"
      - id: B2
        title: The second administrator reads the blast radius and publishes
        steps:
          - as: adminB
            do: { signIn: { user: adminB } }
          - do: { readBlastRadius: { edition: "${edition}" } }
            expect:
              - blastRadius: { edition: "${edition}", rowsChanged: 1, holders: 1, row: { code: "${grid}", from: 0.468809, to: 0.44, percent: -6.15 }, organization: { name: "${org}", estimatedKgCo2eDelta: -3485.89, lastRun: Run 001, lockedPeriod: FY2025 } }
                why: "the correction's Run 001 priced 121,000 kWh; (0.44 - 0.468809) × 121,000 is about -3,486 kg CO₂e"
          - do: { publishEdition: { edition: "${edition}", appliesFrom: "" } }
            expect:
              - screenReads: { text: "Give the date the edition applies from. It is the vintage boundary an adoption is run from." }
              - dialogButtonDisabled: { dialog: "Publish ${edition}", button: Publish, rule: ghg.pack.applies-from-required }
          - do: { publishEdition: { edition: "${edition}", appliesFrom: "2026-01-01", sourceDocument: "Gas supplier delivery note, March 2025 (test source)" } }
            expect:
              - editionListed: { edition: "${edition}", status: PUBLISHED, appliesFrom: "2026-01-01", supersedes: ghana }
              - editionListed: { edition: ghana, status: SUPERSEDED }
              - editionMetadata: { edition: "${edition}", curator: adminA, approver: adminB }
                why: "\"ghana-2027-gov was published.\"; ghana reads SUPERSEDED because the new edition applies after it; the Metadata tab prints the provenance review and the evidence checksum, not the publication moment, which the edition's events carry"
          - as: ama
            do: { signIn: { user: ama } }
          - expect:
              - factorListed: { organization: "${org}", name: "${gridFactor}", versions: [ghana] }
              - runListed: { organization: "${org}", inventory: FY2025, run: 5, totalKgCo2e: 120373.32 }
                why: "0.468809 and 120,373.32 kg: publishing moved nothing"
  - id: C
    title: The organization decides
    cases:
      - id: C1
        title: The notice is in the organization's workspace
        steps:
          - expect:
              - updatesBadge: { organization: "${org}", count: 1 }
          - do: { openUpdates: { organization: "${org}" } }
            expect:
              - noticeListed: { organization: "${org}", edition: "${edition}", predecessor: ghana, rowsAffected: 1, rowsOverThreshold: 1, status: OPEN }
                why: raised now, with the estimated movement
          - do: { reviewNotice: { organization: "${org}", edition: "${edition}" } }
            expect:
              - noticeDiff: { organization: "${org}", edition: "${edition}", predecessor: ghana, appliesFrom: "2026-01-01", rows: 7, row: { code: "${grid}", current: 0.468809, new: 0.44, percent: -6.15 }, earlierPeriodsInclude: [FY2025] }
                why: "six lineages at 0% and the grid row; the movement is estimated over the open FY2025 equity view"
          - expect:
              - noticeDiff: { organization: "${org}", edition: "${edition}", hasBaseYear: false }
                why: "once a base year is designated (procedure 8), the note says instead that accepting raises a recalculation candidate and, above the significance threshold, holds final designation and publication until it is completed or declined"
      - id: C2
        title: A preparer reads and cannot decide
        steps:
          - as: esi
            do: { signIn: { user: esi } }
          - do: { acceptNotice: { organization: "${org}", edition: "${edition}", answer: VINTAGE_PROGRESSION } }
            expect:
              - roleDisabled: { button: Accept }
              - roleDisabled: { button: Decline }
                why: fully readable
      - id: C3
        title: Support access reads everything and cannot decide
        steps:
          - as: adminB
            do: { signIn: { user: adminB } }
          - expect:
              - organizationNotListed: { organization: "${org}" }
                why: an administrator is an outsider
          - do: { assumeSupportAccess: { organization: "${org}", reason: short } }
            expect:
              - dialogButtonDisabled: { dialog: "Assume access to {orgLabel:${org}}", button: Assume access, rule: ghg.support-access.reason-too-short }
          - do: { assumeSupportAccess: { organization: "${org}", reason: "Ticket 118: the owner asked what the notice means" } }
            why: "\"Support access to Adansi Foods Ltd assumed.\""
          - do: { openUpdates: { organization: "${org}" } }
            expect:
              - screenReads: { text: "under support access until" }
              - observe: { text: "Every page carries the banner \"You are in Adansi Foods Ltd under support access until <time>. Every act is recorded in this organization's history.\". Settings opens only on Baseline and targets, with no Organization tab, and the foot of the sidebar reads \"Support access\" where a member's reads their role." }
          - do: { acceptNotice: { organization: "${org}", edition: "${edition}", answer: VINTAGE_PROGRESSION } }
            expect:
              - refused: { rule: ghg.support-access.cannot-decide, with: { act: adopt an edition for an organization } }
          - do: { declineNotice: { organization: "${org}", edition: "${edition}" } }
            expect:
              - refused: { rule: ghg.support-access.cannot-decide, with: { act: decline an edition for an organization } }
          - do: { endSupportAccess: { organization: "${org}" } }
            expect:
              - organizationNotListed: { organization: "${org}" }
                why: the organization leaves the administrator's list
          - as: ama
            do: { signIn: { user: ama } }
          - expect:
              - historyHas: { organization: "${org}", action: ADMIN_ACCESS_ASSUMED, actor: adminB, detail: "Ticket 118: the owner asked what the notice means" }
              - historyHas: { organization: "${org}", action: ADMIN_ACCESS_ENDED, actor: adminB }
                why: each with Admin B's email, the moment and the reason
      - id: C4
        title: The reviewer answers the question and accepts
        steps:
          - as: kofi
            do: { signIn: { user: kofi } }
          - do: { acceptNotice: { organization: "${org}", edition: "${edition}" } }
            expect:
              - answersOffered: {}
              - dialogButtonDisabled: { dialog: "{editionName:${org}|${edition}}", button: Accept, rule: ghg.adoption.answer-required }
          - do: { acceptNotice: { organization: "${org}", edition: "${edition}", answer: VINTAGE_PROGRESSION } }
            expect:
              - noticeListed: { organization: "${org}", edition: "${edition}", status: ACCEPTED, decidedBy: kofi }
              - updatesBadge: { organization: "${org}", count: 0 }
                why: "\"Adopted ghana-2027-gov: 1 version cut, 0 lineages added.\""
          - expect:
              - factorListed: { organization: "${org}", name: "${gridFactor}", versions: [ghana, "${edition}"] }
                why: "the old version until 2025-12-31 at 0.468809, the live one from 2026-01-01 at 0.44; nothing rewrote a past value"
          - as: ama
            do: { signIn: { user: ama } }
          - expect:
              - historyHas: { organization: "${org}", action: FACTOR_PACK_ADOPTED, actor: kofi, detail: as a vintage progression }
                why: "Settings is the owner's; Overview carries no event list, History is the organization's record"
          - expect:
              - observe: { text: "Open Settings and the Baseline and targets tab: no base year is designated yet, so no candidate was raised. The answer lives on the notice." }
  - id: D
    title: The next run cites the new vintage
    cases:
      - id: D1
        title: FY2026
        steps:
          - do: { importActivities: { organization: "${org}", file: adansi-2026.csv } }
            expect:
              - activityExists: { organization: "${org}", record: ACT-0018, quantity: 2100, unit: litre }
              - activityExists: { organization: "${org}", record: ACT-0019, quantity: 110, unit: MWh }
                why: "\"2 records imported.\"; the two rows removed in procedure 3 do not count as duplicates"
          - do: { createInventory: { organization: "${org}", name: FY2026, periodStart: "2026-01-01", periodEnd: "2026-12-31", approach: OPERATIONAL_CONTROL, gwpSet: AR5, straddle: PRO_RATE, prefillBoundary: true } }
          - do: { reviewActivityData: { organization: "${org}", inventory: FY2026 } }
            expect:
              - recordView: { organization: "${org}", inventory: FY2026, record: ACT-0018, status: UNCLASSIFIED }
              - recordView: { organization: "${org}", inventory: FY2026, record: ACT-0019, status: UNCLASSIFIED }
              - recordView: { organization: "${org}", inventory: FY2026, record: ACT-0006, status: UNCLASSIFIED }
              - recordView: { organization: "${org}", inventory: FY2026, record: ACT-0001, status: EXCLUDED, reason: OUTSIDE_PERIOD }
              - gateFinding: { organization: "${org}", inventory: FY2026, gate: COMPLETENESS, severity: WARNING, containing: "15 of 32 days" }
                why: "three records are included: the two January rows and ACT-0006, the year-end LPG, whose 2025-12-15 to 2026-01-15 period reaches 15 days into 2026; every 2025 record is excluded as outside the period; the run pro-rates ACT-0006 to 46.88%"
          - do: { classifyRecord: { organization: "${org}", inventory: FY2026, record: ACT-0018, factor: "${lpg}" } }
          - do: { classifyRecord: { organization: "${org}", inventory: FY2026, record: ACT-0006, factor: "${lpg}" } }
          - do: { classifyWithSuggestion: { organization: "${org}", inventory: FY2026, record: ACT-0019 } }
            expect:
              - observe: { text: "The picker offers the defra-2026 LPG version, the one live in 2026. The grid preview reads \"110 MWh → 110,000 kWh × 0.44 kg CO₂e/kWh\": the suggestion is the version live in the period." }
          - do: { setResidualMix: { organization: "${org}", inventory: FY2026, available: false } }
          - do: { freezeInventory: { organization: "${org}", inventory: FY2026 } }
          - do: { launchRun: { organization: "${org}", inventory: FY2026 } }
            expect:
              - runListed: { organization: "${org}", inventory: FY2026, run: 1, totalKgCo2e: 52253.90 }
              - runLine: { organization: "${org}", inventory: FY2026, run: 1, record: ACT-0019, kgCo2e: 48400 }
              - runLine: { organization: "${org}", inventory: FY2026, run: 1, record: ACT-0018, kgCo2e: 3269.97 }
              - runLine: { organization: "${org}", inventory: FY2026, run: 1, record: ACT-0006, kgCo2e: 583.92, coveredDays: 15, periodDays: 32 }
                why: "48,400 for the electricity, 3,269.97 for the January LPG (2,100 litre × 1.55713) and 583.92 for the 15 pro-rated days of the year-end LPG (375 litre × 1.55713)"
          - expect:
              - reportCites: { organization: "${org}", inventory: FY2026, run: 1, factor: "${gridFactor}", edition: "${edition}", from: "2026-01-01" }
              - reportCites: { organization: "${org}", inventory: FY2026, run: 1, factor: "Gaseous fuels: LPG", edition: defra-2026, from: "2026-01-01" }
                why: "open the PDF and read the factor table: the grid row cites ghana-2027-gov from 2026-01-01; the LPG row cites defra-2026 from 2026-01-01"
          - expect:
              - runLine: { organization: "${org}", inventory: FY2025 (correction), run: 1, record: ACT-0002, kgCo2e: 56725.89 }
                why: "still 56,725.89 kg on the grid line at 0.468809: the reported year kept its factors"
  - id: E
    title: An edition inside a reported period
    cases:
      - id: E1
        title: Accepting is refused, declining stays open
        steps:
          - as: adminB
            do: { signIn: { user: adminB } }
          - do: { cloneEdition: { from: "${edition}", editionId: "${r2}" } }
          - do: { editPackRow: { edition: "${r2}", code: "${grid}", kgCo2ePerUnit: 0.45 } }
          - do: { attachSourceDocument: { edition: "${r2}", file: source-document.txt } }
          - as: adminA
            do: { signIn: { user: adminA } }
          - do: { publishEdition: { edition: "${r2}", appliesFrom: "2025-06-01", sourceDocument: "Gas supplier delivery note, March 2025 (test source)" } }
            expect:
              - editionListed: { edition: "${r2}", status: PUBLISHED, appliesFrom: "2025-06-01" }
              - editionListed: { edition: "${edition}", status: PUBLISHED }
              - editionMetadata: { edition: "${r2}", curator: adminB, approver: adminA }
                why: "an edition that applies from an earlier date than the one standing is not its successor, so it supersedes nothing (spec 02.5); the roles swap with the curator"
          - as: kofi
            do: { signIn: { user: kofi } }
          - expect:
              - updatesBadge: { organization: "${org}", count: 1 }
          - do: { reviewNotice: { organization: "${org}", edition: "${r2}" } }
            expect:
              - noticeDiff: { organization: "${org}", edition: "${r2}", blockedBy: FY2025 }
                why: "\"2025-06-01 falls inside FY2025 (2025-01-01 → 2025-12-31), which is published. A reported period keeps the factors it reported with, so this edition cannot be accepted while the platform blocks editions inside a published period. Declining stays available.\""
          - do: { acceptNotice: { organization: "${org}", edition: "${r2}", answer: ERRATUM_ON_REPORTED_YEAR } }
            expect:
              - refused:
                  rule: ghg.pack.applies-inside-locked-period
                  with:
                    edition: "${r2}"
                    appliesFrom: "2025-06-01"
                    inventory: FY2025
                    start: "2025-01-01"
                    end: "2025-12-31"
                    status: PUBLISHED
                    exit: "The edition cannot be imported while that period is on record and the platform setting Editions inside a published period is Blocked; choose an edition that applies from a later date, or ask a platform administrator about the setting."
                why: the refusal names the platform setting
          - expect:
              - factorListed: { organization: "${org}", name: "${gridFactor}", versions: [ghana, "${edition}"] }
                why: "still two versions: the refusal wrote nothing"
  - id: F
    title: Withdrawal
    cases:
      - id: F1
        title: A withdrawal closes the notice and moves no factor
        steps:
          - as: adminA
            do: { signIn: { user: adminA } }
          - do: { withdrawEdition: { edition: "${r2}", reason: short } }
            expect:
              - refused: { rule: ghg.pack.withdrawal-reason-too-short, with: { min: "10" } }
          - do: { withdrawEdition: { edition: "${r2}", reason: "Published against the wrong period; retracted" } }
            expect:
              - editionListed: { edition: "${r2}", status: WITHDRAWN }
                why: "\"ghana-2027-gov.r2 was withdrawn.\"; the reason reaches the organizations, on the Updates row of case F1.4; the edition page itself prints the status, not the reason"
          - do: { cloneEdition: { from: ghana, editionId: ghana-scratch } }
          - do: { openEdition: { edition: ghana-scratch } }
            expect:
              - buttonsOffered: { present: [Delete draft], absent: [Withdraw] }
                why: "a draft offers no Withdraw: no organization can see it, so there is nothing to retract"
          - do: { deleteDraft: { edition: ghana-scratch } }
          - as: kofi
            do: { signIn: { user: kofi } }
          - do: { openUpdates: { organization: "${org}" } }
            expect:
              - noticeListed: { organization: "${org}", edition: "${r2}", status: WITHDRAWN, withdrawalReason: "Published against the wrong period; retracted" }
              - updatesBadge: { organization: "${org}", count: 0 }
          - do: { reviewNotice: { organization: "${org}", edition: "${r2}" } }
            expect:
              - screenReads: { text: "The publisher withdrew this edition, so there is nothing to decide." }
          - expect:
              - factorListed: { organization: "${org}", name: "${gridFactor}", versions: [ghana, "${edition}"] }
              - runListed: { organization: "${org}", inventory: FY2025, run: 5, totalKgCo2e: 120373.32 }
                why: "two versions, 120,373.32 kg: a withdrawal is the publisher's act"
docs:
  version: 5
  estimatedMinutes: 40
  objective: >-
    Confirm that a platform administrator clones a published edition into a
    draft, changes one value, reads the validation report, and cannot publish
    the draft they curated; that a second administrator publishes it with its
    source document and applies-from date; that the organization sees the
    notice in its own workspace, reads what a decision would move, refuses the
    preparer and the administrator under support access, and accepts as a
    reviewer with the chapter 5 answer; that the next run cites the new vintage
    while the reported year keeps its figures; that an edition applying inside
    a published period cannot be adopted while the platform blocks it, and the
    refusal says so; and that a withdrawal closes the notice it raised without
    touching a factor.
  coversText: Spec 01.3 for support access, spec 01.5 for the administration panel.
  runNote: >-
    The edition identifiers it publishes are citations and can never be
    reused: a second pass on the same database needs new ones.
  prerequisitesText:
    - "Adansi Foods Ltd holding the `ghana` edition (procedure 2) with FY2025 published and its correction frozen (procedure 6)."
    - Admin A in the normal window; Admin B, Ama, Esi and Kofi in the private window as the cases name them.
    - "`fixtures/source-document.txt` and `fixtures/adansi-2026.csv`."
  knownNonGoals: >-
    a family created from scratch, a template row and the gas-split
    reconciliation (the mining pack, procedure 10); an accepted edition that
    raises a base-year candidate above the threshold (the movement here is
    2.87% against a 5% threshold, and procedure 8 raises its candidate by
    hand); support access expiring by time; accepting under the setting
    "Allowed: published runs keep their factors", which the FY2025
    correction's frozen period would still block here (the mining pack,
    procedure 10 case E5, covers the setting).
  changeNotes:
    - version: 2
      date: "2026-09-29"
      text: >-
        E1 steps 2 and 3: the drawer and the refusal name the platform setting
        Editions inside a published period (PR #122). The case that switches
        the setting to Allowed and back is in the mining pack, procedure 10
        case E5, not here: the FY2025 correction is frozen over the same
        period, and a frozen period blocks under either value. C3 step 4 reads
        "Support access" at the foot of the sidebar (PR #119).
    - version: 3
      date: "2026-09-29"
      text: >-
        B1 and B2: the source citation is typed by the publisher, since the
        curator's typing is not kept once the dialog closes. C1 step 4: with no
        base year the drawer no longer also warns that accepting raises a
        candidate (the walkthrough fix of 2026-09-29).
    - version: 4
      date: "2026-10-02"
      text: >-
        Transliterated to the QA scenario DSL. The editions, their rows, the
        validation report, the blast radius, the notices and their diff, the
        support grants and the history are read from the API as well as from
        the screen; the clone dialog's preamble, the banner's wording, the
        picker's preview and the adoption toast are observed on screen. The
        refusals carry rule ids (ghg.pack.*, ghg.adoption.*,
        ghg.support-access.*), and the imported 2026 rows are ACT-0014 and
        ACT-0015, the two rows procedure 3 removed having kept their numbers.
    - version: 5
      date: "2026-10-06"
      text: >-
        D1 cites the imported 2026 rows by the numbers they now receive,
        ACT-0018 and ACT-0019: the records procedure 3 gained since version 4
        take the numbers before them. Only the litre row had been renumbered.
