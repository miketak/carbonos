procedure: 3
slug: activity-data
title: Activity data
after: 2
covers: ["04", "04.4", "04.5", "04.6", "04.10", "04.11", "04.12", "08"]
let:
  org: Adansi Foods Ltd
sections:
  - id: A
    title: The clean file
    cases:
      - id: A1
        title: The template, and the dry run
        steps:
          - as: ama
            do: { signIn: { user: ama } }
          - expect:
              - importTemplateHeader: { organization: "${org}", header: "facility,emission_source,activity_type,quantity,unit,period_start,period_end,data_source,supplier,evidence_ref,data_quality,data_quality_tier,uncertainty_percent,note" }
          - do: { previewImport: { organization: "${org}", file: adansi-2025.csv } }
            expect:
              - importPreview:
                  recordsToAdd: 10
                  totals:
                    - { facility: Kumasi Plant, stream: Boiler LPG, unit: litre, quantity: 2400 }
                    - { facility: Kumasi Plant, stream: Plant grid supply, unit: MWh, quantity: 120 }
                    - { facility: Tema Depot, stream: Delivery fleet, unit: litre, quantity: 5000 }
                  warning: { row: 7, containing: "the period is longer than one month (2025-12-15 to 2026-01-15)" }
                  ready: [2, 3, 4]
                  noStream: 7
                  noEvidence: 2
                why: '"Missing source" appears nowhere, every row names its data source'
      - id: A2
        title: The import, and the same file again
        steps:
          - do: { importActivities: { organization: "${org}", file: adansi-2025.csv } }
            expect:
              - activityCount: { organization: "${org}", count: 10 }
              - activityRefs: { organization: "${org}", from: ACT-0001, to: ACT-0010 }
              - activityOrder: { organization: "${org}", newestPeriodFirst: true, first: ACT-0006, last: ACT-0001 }
          - do: { previewImport: { organization: "${org}", file: adansi-2025.csv } }
            expect:
              - importRejected: { rows: all, messages: { "2": "duplicate: the same facility, activity, quantity, unit and period already exist on file or earlier in this file" } }

  - id: B
    title: The rejected file
    cases:
      - id: B1
        title: Four rows, four reasons, nothing written
        steps:
          - do: { previewImport: { organization: "${org}", file: adansi-2025-rejected.csv } }
            expect:
              - importRejected:
                  rows: 4
                  messages:
                    "2": "quantity '1,2O0' is not a number"
                    "3": "period_start is in the future"
                    "4": "no facility named 'Kumasi Depot'"
                    "5": "duplicate: the same facility, activity, quantity, unit and period already exist on file or earlier in this file"
                why: the header is row 1, so the rows are named 2 to 5; row 3 also reads "period_end is in the future" because an empty end takes the start; row 5 repeats ACT-0001
              - activityCount: { organization: "${org}", count: 10 }
                why: a file imports whole or not at all

  - id: C
    title: Readiness
    cases:
      - id: C1
        title: The banner counts what is missing, and a fix clears it
        steps:
          - expect:
              - attentionCount: { organization: "${org}", count: 7 }
                why: ACT-0004 to ACT-0010; the wording is about completeness, not assurance
          - expect:
              - activityExists: { organization: "${org}", record: ACT-0009, issues: [NO_STREAM, NO_EVIDENCE] }
                why: its tier is not missing, a blank tier follows the method, ESTIMATED to tier 4
          - do: { correctActivity: { organization: "${org}", record: ACT-0009, evidenceRef: WB-2025-11, reason: Weighbridge ticket found } }
            expect:
              - activityExists: { organization: "${org}", record: ACT-0009, evidenceRef: WB-2025-11, issues: [NO_STREAM, EVIDENCE_REFERENCE_ONLY] }
              - attentionCount: { organization: "${org}", count: 7 }
                why: '"Needs evidence" goes and the drawer reads "Reference WB-2025-11, nothing attached"; the emission source is still missing, and a record leaves the count only when every item on it is resolved'

          - do: { resolveAttention: { organization: "${org}" } }
            expect:
              - attentionListed: { organization: "${org}", count: 7 }
                why: the register lists exactly the seven after the correction, with the tab in the address; a stale list of ten was seen once in the walkthrough of 2026-09-24 (P3 C1.2)
  - id: D
    title: Drafts
    cases:
      - id: D1
        title: A draft holds a source until its figures arrive
        steps:
          - do: { addActivityDraft: { organization: "${org}", facility: Kumasi Plant, activityType: Generator diesel } }
          - do: { enterActivity: { organization: "${org}", record: Generator diesel, quantity: 150, unit: litre, periodStart: "2025-02-01", periodEnd: "2025-02-28" } }
          - expect:
              - observe: { text: "Open the record again: the drawer offers Save but no Save draft. A saved record is corrected with a reason or removed with a reason; it cannot go back to a draft." }

  - id: E
    title: Corrections
    cases:
      - id: E1
        title: A correction needs a reason and keeps the history
        steps:
          - do: { correctActivity: { organization: "${org}", record: ACT-0002, quantity: 121, reason: typo } }
            expect:
              - refused: { rule: ghg.reason-too-short, with: { what: A correction } }
          - do: { correctActivity: { organization: "${org}", record: ACT-0002, quantity: 121, reason: "Invoice re-read: 121 MWh" } }
            expect:
              - activityHistoryHas: { organization: "${org}", record: ACT-0002, kind: CORRECTED, reason: "Invoice re-read: 121 MWh", field: quantity, before: "120", after: "121" }
          - do: { correctActivity: { organization: "${org}", record: ACT-0002, quantity: 120, reason: Back to the invoice figure for the procedures } }
            expect:
              - activityHistoryHas: { organization: "${org}", record: ACT-0002, kind: CORRECTED, reason: Back to the invoice figure for the procedures, field: quantity, before: "121", after: "120" }
                why: the history holds both corrections, nothing is overwritten

  - id: F
    title: Evidence
    cases:
      - id: F1
        title: A file and a link attach; a wrong type and a bare address are refused
        steps:
          - do: { attachFile: { organization: "${org}", record: ACT-0001, file: not-evidence.zip } }
            expect:
              - refused: { rule: ghg.evidence.unsupported-type }
          - do: { attachFile: { organization: "${org}", record: ACT-0001, file: source-document.txt } }
          - do: { attachLink: { organization: "${org}", record: ACT-0001, name: Supplier portal, url: www.example.test/delivery/LPG-2025-03 } }
            expect:
              - refused: { rule: ghg.evidence.link-scheme }
          - do: { attachLink: { organization: "${org}", record: ACT-0001, name: Supplier portal, url: https://example.test/delivery/LPG-2025-03 } }
            expect:
              - evidenceListed: { organization: "${org}", record: ACT-0001, name: Supplier portal, kind: LINK, count: 2 }

  - id: G
    title: Removals
    cases:
      - id: G1
        title: A removal needs a reason, and several are removed with one
        steps:
          - do: { removeActivity: { organization: "${org}", record: Generator diesel, reason: Scratch record for the draft case } }
            expect:
              - activityCount: { organization: "${org}", count: 10 }
                why: the dialog keeps its button disabled until a reason is typed; the record's history is kept
          - do: { importActivities: { organization: "${org}", file: adansi-2026.csv } }
            expect:
              - activityCount: { organization: "${org}", count: 12 }
          - do: { removeActivities: { organization: "${org}", records: [ACT-0012, ACT-0013], reason: Scratch rows for the bulk removal case } }
            expect:
              - activityCount: { organization: "${org}", count: 10 }
                why: both go under the one reason; procedure 7 imports the same file again for FY2026, and a removed record does not count as a duplicate
      - id: G2
        title: A facility with records is not removed
        steps:
          - do: { removeFacility: { organization: "${org}", facility: Takoradi Cold Store, reason: walkthrough removal of a site with records } }
            expect:
              - refused: { rule: ghg.facility.has-records, with: { facility: Takoradi Cold Store } }

  - id: H
    title: Source documents
    cases:
      - id: H1
        title: Every document with its record
        steps:
          - expect:
              - sourceDocumentListed: { organization: "${org}", name: source-document.txt, record: ACT-0001 }
              - sourceDocumentListed: { organization: "${org}", name: Supplier portal, record: ACT-0001 }
              - importBatchListed: { organization: "${org}", file: adansi-2025.csv }
              - importBatchListed: { organization: "${org}", file: adansi-2026.csv }
          - expect:
              - evidenceIndexHeader: { organization: "${org}", header: "record_ref,activity_type,facility,period_start,period_end,evidence_ref,document,kind,url,content_type,size_bytes,uploaded_by,uploaded_at" }

  - id: I
    title: The register and its URL
    cases:
      - id: I1
        title: A view is a link
        steps:
          - expect:
              - observe: { text: 'Type "diesel" in the search and choose the facility Kumasi Plant: one record, ACT-0004, and the address bar carries the search and the facility. Open ACT-0004, copy the address and open it in a new tab: the same view opens with the same record in the drawer. Press Escape, then use the arrow keys and Enter on the table: the cursor moves down the rows and Enter opens the record under it.' }

  - id: J
    title: Unknown sources, and several records at once
    cases:
      - id: J1
        title: A name the facility lacks is decided in the preview
        steps:
          - do: { previewImport: { organization: "${org}", file: adansi-2025-new-sources.csv } }
            expect:
              - importUnknownSources:
                  sources:
                    - { name: Boiler LPG 2, facility: Kumasi Plant, candidates: [Boiler LPG] }
                    - { name: Chiller units, facility: Kumasi Plant, candidates: [] }
                why: nothing is rejected and nothing is matched silently; "Boiler LPG 2" is a near miss of Boiler LPG, so it is offered; "Chiller units" is near nothing; the third row names no source and waits on nothing
          - do:
              decideImport:
                organization: "${org}"
                file: adansi-2025-new-sources.csv
                decisions:
                  - { name: Boiler LPG 2, facility: Kumasi Plant, use: Boiler LPG }
                  - { name: Chiller units, facility: Kumasi Plant, create: { kind: FUGITIVE, fuel: R-410A } }
            expect:
              - importResolved: { recordsToAdd: 3 }
                why: a suggested near name needs no reason; a name near nothing is created without one
          - do:
              importDecided:
                organization: "${org}"
                file: adansi-2025-new-sources.csv
                decisions:
                  - { name: Boiler LPG 2, facility: Kumasi Plant, use: Boiler LPG }
                  - { name: Chiller units, facility: Kumasi Plant, create: { kind: FUGITIVE, fuel: R-410A } }
            expect:
              - screenReads: { text: "3 records imported. 1 emission source added during import." }
              - activityCount: { organization: "${org}", count: 13 }
              - activityHasSource: { organization: "${org}", record: ACT-0014, source: Boiler LPG }
              - activityHasSource: { organization: "${org}", record: ACT-0015, source: Chiller units }
              - streamListed: { organization: "${org}", facility: Kumasi Plant, name: Chiller units, kind: FUGITIVE, origin: IMPORT }
              - historyHas: { organization: "${org}", action: IMPORT_SOURCE_MAPPED, detail: "'Boiler LPG 2' in row 2 of adansi-2025-new-sources.csv mapped to 'Boiler LPG'" }
              - historyHas: { organization: "${org}", action: STREAM_ADDED, detail: "Chiller units added at Kumasi Plant: fugitive, during import of adansi-2025-new-sources.csv" }
                why: the mapping and the creation each leave a row a verifier reads without opening the file; the created source is marked "added during import" on the facility's Emission sources page
      - id: J2
        title: One source for several records, one reason, one act
        steps:
          - do: { assignSourceToActivities: { organization: "${org}", records: [ACT-0016], source: Chiller units, reason: The chillers draw from the plant meter } }
            expect:
              - activityHistoryHas: { organization: "${org}", record: ACT-0016, kind: CORRECTED, field: stream, after: Chiller units, reason: The chillers draw from the plant meter }
              - historyHas: { organization: "${org}", action: RECORDS_BULK_CORRECTED, detail: "Emission source 'Chiller units' assigned to 1 record (ACT-0016): The chillers draw from the plant meter" }
                why: the record's history reads as a single correction; the organization's history names the act once
          - expect:
              - observe: { text: "Tick ACT-0001 (which has a source) together with ACT-0016: **Assign emission source** is disabled with \"Select records at one facility with no emission source.\" The act fills a gap; it never moves a record from one source to another, because the source sets the default scope. A move is a correction of the one record, with its own reason." }
          - do: { removeActivities: { organization: "${org}", records: [ACT-0014, ACT-0015, ACT-0016], reason: Scratch rows for the unknown-source case } }
            expect:
              - activityCount: { organization: "${org}", count: 10 }
              - historyHas: { organization: "${org}", action: RECORDS_BULK_CORRECTED, detail: "3 records removed (ACT-0014, ACT-0015, ACT-0016): Scratch rows for the unknown-source case" }
                why: the three go under one reason in one request; the register is back to the ten records procedure 4 works on
          - do: { removeStream: { organization: "${org}", facility: Kumasi Plant, name: Chiller units } }
            expect:
              - streamAbsent: { organization: "${org}", facility: Kumasi Plant, name: Chiller units }
                why: with its records removed the source can go; Kumasi Plant is back to the two sources procedure 2 gave it, and the history keeps the import, the mapping and the removals

  - id: K
    title: The documented zero, the supplier and the monthly template
    cases:
      - id: K1
        title: A month with nothing to report is a fact
        steps:
          - as: ama
            expect:
              - observe: { text: 'Click **+ Add activity**, choose Kumasi Plant and Boiler LPG, type 0 as the quantity: the field reads "A zero needs a note: what showed that nothing was consumed. A meter or log reading is measured; ''the site said so'' is estimated." and **Notes** reads "Required for a zero". Click **Save** with the note empty: "A zero needs a note of at least 10 characters: what showed that nothing was consumed." prints under **Context for the reviewer** and nothing is saved.' }
          - do: { addActivity: { organization: "${org}", facility: Kumasi Plant, source: Boiler LPG, activityType: "Boiler LPG, February", quantity: 0, unit: litre, periodStart: "2025-02-01", periodEnd: "2025-02-28", dataSource: Gas supplier delivery note, evidenceRef: LPG-2025-02, supplier: Ghana Gas, note: "Boiler off for relining; no delivery in February" } }
            expect:
              - activityExists: { organization: "${org}", record: ACT-0017, quantity: 0, unit: litre, issues: [DOCUMENTED_ZERO, EVIDENCE_REFERENCE_ONLY], supplier: Ghana Gas }
                why: a zero with its note, a data source and a reference is Ready and labelled "documented zero"; the supplier is who billed it, the data source what showed the figure
          - do: { removeActivity: { organization: "${org}", record: ACT-0017, reason: Scratch record for the documented-zero case } }
            expect:
              - activityCount: { organization: "${org}", count: 10 }
      - id: K2
        title: The monthly template
        steps:
          - as: ama
            expect:
              - monthlyTemplateRows: { organization: "${org}", facility: Kumasi Plant, month: "2025-09", sources: [Boiler LPG, Plant grid supply] }
                why: a source that ran nothing is recorded as 0 with a note and its reading, not deleted; data quality is left blank because a zero typed from memory is an estimate

  - id: L
    title: Editing a source with records
    cases:
      - id: L1
        title: A change of kind on a source with records needs a reason, and the records keep theirs
        steps:
          - do: { editStream: { organization: "${org}", facility: Kumasi Plant, name: Boiler LPG, kind: MOBILE_COMBUSTION } }
            expect:
              - refused: { rule: ghg.stream.reclassify-reason-required, with: { name: Boiler LPG } }
                why: the kind and the operator are the source's operational-boundary decision (Corporate Standard chapter 4); with records filed under it, the change is documented or not made
          - do: { editStream: { organization: "${org}", facility: Kumasi Plant, name: Boiler LPG, kind: MOBILE_COMBUSTION, reason: moved } }
            expect:
              - refused: { rule: ghg.stream.reclassify-reason-required, with: { name: Boiler LPG } }
                why: five characters say nothing a verifier can read
          - do: { editStream: { organization: "${org}", facility: Kumasi Plant, name: Boiler LPG, kind: MOBILE_COMBUSTION, reason: "boiler skid moved onto a trailer and towed between the two plant halls since June" } }
            expect:
              - streamListed: { organization: "${org}", facility: Kumasi Plant, name: Boiler LPG, kind: MOBILE_COMBUSTION }
              - historyHas: { organization: "${org}", action: STREAM_EDITED, detail: "Boiler LPG at Kumasi Plant: kind stationary combustion → mobile combustion; reason: boiler skid moved onto a trailer and towed between the two plant halls since June", actor: ama }
                why: the row carries the reason; the records already filed keep the scope and category they were classified under, and only new records take the new default
          - do: { editStream: { organization: "${org}", facility: Kumasi Plant, name: Boiler LPG, fuel: LPG (bulk) } }
            expect:
              - historyHas: { organization: "${org}", action: STREAM_EDITED, detail: "Boiler LPG at Kumasi Plant: fuel LPG → LPG (bulk)" }
                why: a fuel change asks no reason; filed records keep the factor they were classified with
          - do: { editStream: { organization: "${org}", facility: Kumasi Plant, name: Boiler LPG, kind: STATIONARY_COMBUSTION, fuel: LPG, reason: "walkthrough: the skid is back on its slab; procedures 4 to 8 expect the boiler as stationary combustion" } }
            expect:
              - streamListed: { organization: "${org}", facility: Kumasi Plant, name: Boiler LPG, kind: STATIONARY_COMBUSTION }
                why: the later procedures classify the boiler's records under the stationary default, so the source goes back as it was, with a reason of its own

docs:
  version: 6
  estimatedMinutes: 45
  objective: >-
    Confirm that a clean file previews with control totals and imports once,
    that a file with a bad row imports nothing and names each row by number,
    and that a record is drafted, entered, corrected, evidenced and removed
    with the reasons the record keeps.
  coversText: Spec 08 for the inline rules.
  runNote: Procedure 4 onwards works on the ten records it imports.
  prerequisitesText:
    - "Adansi Foods Ltd as procedure 2 leaves it: three facilities, three emission sources."
    - The fixture files `adansi-2025.csv`, `adansi-2025-rejected.csv`, `adansi-2026.csv`, `adansi-2025-new-sources.csv`, `source-document.txt` and `not-evidence.zip`.
    - Ama in the normal window.
  knownNonGoals: >-
    the 20 MB evidence limit and the 10,000-row import limit (no fixture of
    that size); a record in a custom unit (the mining pack); the register's
    sorting and paging beyond ten records.
  changeNotes:
    - version: 2
      date: "2026-09-29"
      text: >-
        C1 step 3 quotes the drawer's evidence line, which now names the
        reference (the walkthrough fix of 2026-09-29).
    - version: 3
      date: "2026-10-02"
      text: >-
        Transliterated to the QA scenario DSL. The dialog's title and eyebrow,
        the readiness pills' wording and the register's keyboard handling are
        observed by hand (case I1) or described in the drivers' projections;
        the import outcomes are checked against the server's preview figures.
    - version: 4
      date: "2026-10-05"
      text: >-
        Spec 04.11: the import is a page reached by Import, the file field is
        "Spreadsheet file", and section J decides two unknown emission source
        names in the preview, assigns a source to several records in one act
        and removes them in one request. Procedure 7's re-import now lands on
        ACT-0017.
    - version: 5
      date: "2026-10-05"
      text: >-
        Spec 04.12: the template header gains supplier; C1 clicks Resolve and
        reads the seven rows; section K enters a documented zero with its
        supplier and removes it, and reads the monthly template. Procedure 7's
        re-import now lands on ACT-0018.
    - version: 6
      date: "2026-10-07"
      text: >-
        New section L: editing a source with records (spec 04.3 amended). A
        change of kind without a reason, or with a five-character one, is
        refused under the field by `ghg.stream.reclassify-reason-required`;
        with a reason it goes through and the "Emission source edited" row
        carries it; a fuel change asks nothing. The case puts Boiler LPG back
        as stationary combustion before procedure 4.
