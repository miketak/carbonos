spring:
  application:
    name: carbonos
  datasource:
    # JDBC-format URL, e.g. jdbc:postgresql://host:5432/carbonos
    # On Railway, compose this from the Postgres service's reference variables (see README).
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # PSD resumes are the ceiling
      max-file-size: 50MB
      max-request-size: 52MB
  modulith:
    events:
      # Flyway owns the event_publication schema (V1 migration)
      jdbc:
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: true

carbonos:
  storage:
    # Any S3-compatible endpoint (Cloudflare R2, Railway bucket, MinIO).
    endpoint: ${STORAGE_ENDPOINT}
    region: ${STORAGE_REGION:auto} # "auto" is what R2 expects
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    bucket: ${STORAGE_BUCKET}
    path-style: ${STORAGE_PATH_STYLE:false}
    create-bucket: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith
  endpoint:
    health:
      probes:
        enabled: true
