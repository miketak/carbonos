# Local development infrastructure. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: carbonos
      POSTGRES_USER: carbonos
      POSTGRES_PASSWORD: carbonos
    ports:
      # Host port 5433: this machine already runs a Postgres on 5432
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbonos"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # S3-compatible object storage mirroring Cloudflare R2's S3 API.
    # Pinned pre-May-2025: later community tags removed the web console (:9001).
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: carbonos
      MINIO_ROOT_PASSWORD: carbonos-secret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio-data:/data
    healthcheck:
      # mc is bundled in the image; curl is not
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    # Local SMTP catcher: outbound mail lands in the web UI, never the internet.
    image: axllent/mailpit:v1.24
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
