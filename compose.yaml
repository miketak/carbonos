# Local development infrastructure. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: carbonos
      POSTGRES_USER: carbonos
      POSTGRES_PASSWORD: carbonos
    ports:
      # Host port 5433: this machine already runs a Postgres on 5432
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbonos"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # S3-compatible object storage mirroring Cloudflare R2's S3 API.
    # MinIO withdrew its public images in September 2026 (Docker Hub, then quay.io); Bitnami's
    # frozen legacy repository still serves the April 2025 build, the last with the web console.
    image: bitnamilegacy/minio:2025.4.22-debian-12-r2
    environment:
      MINIO_ROOT_USER: carbonos
      MINIO_ROOT_PASSWORD: carbonos-secret
      MINIO_BROWSER: "on"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    # Local SMTP catcher: outbound mail lands in the web UI, never the internet.
    image: axllent/mailpit:v1.24
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
