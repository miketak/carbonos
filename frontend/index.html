<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- the 16px PNG is drawn on the pixel grid by hand; SVG rasterisers do not hint -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarbonOS</title>
    <meta
      name="description"
      content="CarbonOS is the greenhouse gas inventory platform that builds the inventory the way the GHG Protocol requires, so it survives verification. Built in Ghana by ECORIV for mining, oil and gas, and construction."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CarbonOS" />
    <meta property="og:title" content="CarbonOS: the GHG inventory that survives verification" />
    <meta
      property="og:description"
      content="Boundaries with dates, factor editions with vintages, immutable calculation runs, and a report whose gases tie to the total. Built in Ghana by ECORIV Land Limited."
    />
    <meta name="theme-color" content="#246169" />
    <!-- the theme choice (spec 10) applied before first paint, from the key src/lib/theme.ts keeps -->
    <script>
      ;(function () {
        try {
          var choice = localStorage.getItem('carbonos.theme')
          var dark =
            choice === 'dark' ||
            (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
