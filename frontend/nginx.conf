server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-lived caching for hashed build assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The end-user help site, a static MkDocs build copied into the image
    # (ADR 0005). It is served as files, never through the SPA fallback, so
    # a missing page is a 404 rather than the app shell.
    location = /help {
        # relative Location: nginx listens on ${PORT} behind Railway's edge,
        # and an absolute redirect would carry that port and plain http
        absolute_redirect off;
        return 301 /help/;
    }
    location /help/ {
        try_files $uri $uri/ =404;
    }

    # SPA fallback: every route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API: proxy /api to the backend over Railway private
    # networking (BACKEND_INTERNAL_URL, e.g. http://backend.railway.internal:8080).
    # Session + CSRF cookies are SameSite=Lax, so the SPA and the API must share
    # an origin — the browser refuses those cookies on cross-site fetches, and
    # the backend intentionally has no CORS configuration.
    location /api/ {
        # Railway's internal DNS (IPv6). Resolving via a variable defers the
        # lookup to request time, so nginx still boots if private DNS isn't
        # ready yet at container start.
        resolver [fd12::10] valid=10s;
        set $backend ${BACKEND_INTERNAL_URL};
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve the scheme Railway's edge saw (nginx itself is plain HTTP)
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
