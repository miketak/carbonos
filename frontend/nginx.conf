server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-lived caching for hashed build assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API calls go directly to the backend service URL (VITE_API_URL),
    # so no proxy is configured here. Add one if same-origin /api is preferred.
}
