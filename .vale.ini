# Prose lint for docs/ and specs/: the Google developer documentation style
# plus the house rules. Advisory in CI; run locally with `make vale`.
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = Google
Vocab = CarbonOS

[*.md]
BasedOnStyles = Vale, Google, CarbonOS
# Unknown words are common in a domain this specific; a spelling miss is a
# prompt to extend the vocabulary, not an error.
Vale.Spelling = warning
# Vale.Terms turns every vocabulary entry into a case rule ("backend" would
# refuse "Backend" at the start of a sentence).
Vale.Terms = NO
# Quoted product strings and log lines are verbatim; the comma stays outside.
Google.Quotes = NO
# Dates: ISO in metadata and "1 July 2025" in prose (specs/README.md).
Google.DateFormat = NO
# Google.Headings wants sentence case; spec titles like "05.1: Inventory
# lifecycle" and QA case labels like "A1." trip it on the number, so it stays
# a suggestion.
Google.Headings = suggestion
