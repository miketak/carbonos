# Production pipeline (trunk-based):
#   Pushing a version tag (v1.2.3) re-runs all quality gates, then deploys the
#   tagged commit to the Railway "production" environment.
#
#   The deploy job is bound to the GitHub "production" environment — add
#   required reviewers under Settings > Environments to gate releases behind
#   a manual approval.
name: Production

on:
  push:
    tags:
      - "v*"

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  backend-checks:
    name: Backend / build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test (includes ModularityTests)
        working-directory: backend
        run: ./mvnw -B verify

  frontend-checks:
    name: Frontend / lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Check formatting
        working-directory: frontend
        run: npm run format:check
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  deploy-production:
    name: Deploy to Railway (production)
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      # Railway project token scoped to the "production" environment
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      # Run from the repo root: the CLI uploads the current directory, and each
      # Railway service selects its subdirectory via its rootDirectory setting.
      - name: Deploy backend
        run: railway up --service backend --ci
      - name: Deploy frontend
        run: railway up --service frontend --ci
