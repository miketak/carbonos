name: QA failure
description: A case of a QA procedure that did not give the expected result on staging or production.
title: "[QA] <procedure> <case>: <summary>"
labels: ["qa", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        One issue per failed case. Copy the expected result from the procedure and describe what you saw instead.
  - type: dropdown
    id: procedure
    attributes:
      label: Procedure
      options:
        - 01 Access and roles
        - 02 Organization setup
        - 03 Activity data
        - 04 Boundary and inventory lifecycle
        - 05 Classification and pre-flight
        - 06 Scope 2 instruments
        - 07 Runs, reports and exports
        - 08 Publication and corrections
        - 09 Base year and recalculation
    validations:
      required: true
  - type: input
    id: case
    attributes:
      label: Case
      description: The case label, for example B4.
      placeholder: B4
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version tested
      description: The line under the document's title, for example "Version v0.6.0 (5b27661), built 2026-09-10".
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Paste the procedure's expected result.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened instead, with the exact wording of any message.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, downloaded files or links (optional).
